# What the durable repair must encode, so a replacement node does not
# recreate these defects:
durable_repair_requirements:
  - id: P0A
    requirement: >
      Install Ed25519 secret material into the ed25519_* slot and generate
      (or supply) type-correct RSA material for the rsa_* slot. The current
      bootstrap installs the Ed25519 key at the RSA path.
    affected_artifact: native/bootstrap-native.sh, cowrie.cfg

  - id: P0B1
    requirement: >
      Ship "processes = /opt/cowrie/share/cowrie/cmdoutput.json". The
      repository's cowrie.cfg still contains "processes = 5".
    affected_artifact: cowrie.cfg

  - id: P0B2
    requirement: >
      Create the tty directory with declared ownership and mode atomically,
      e.g. "install -d -o cowrie -g cowrie -m 750
      /opt/cowrie/var/lib/cowrie/tty", rather than a bare mkdir.
    affected_artifact: native/bootstrap-native.sh

# Delivery constraint carried over from the H2 gate: bootstrap-native.sh is
# BootstrapBundleId -> UserData -> instance replacement. Any repair shipped
# through that path replaces the running instance and ends the current
# observational epoch. Live-instance repair must therefore go via an SSM
# Association, as AuthParity and H2 both did.
delivery_constraint:
  bootstrap_native_sh: "BootstrapBundleId -> UserData -> REPLACEMENT HAZARD"
  safe_path_for_running_instance: "SSM Association (AuthParity/H2 precedent)"

validation_traffic:
  synthetic: true
  source_ip: 127.0.0.1
  marker_credential: "root / P0-VALIDATION-20260923"
  exclude_from_attacker_statistics: true
  note: >
    Generated on-instance against the loopback listener. No traffic was
    directed at Control-0's public interface and no synthetic events were
    injected into the Cowrie corpus.
