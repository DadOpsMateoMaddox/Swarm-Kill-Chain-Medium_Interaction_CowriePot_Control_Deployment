# Live-vs-IaC divergence record.
#
# The project invariant is that deployed state is established from the live
# CloudFormation template and live resource state, never inferred from Git.
# These three repairs were applied directly to the running instance to
# restore a broken sensor. They exist in NO template and will NOT survive an
# instance replacement. This file exists so the divergence is governed
# rather than silently accumulated.

live_drift:
  instance: i-00270aeefb6266a7b
  applied_utc: "2026-09-23T07:27:48Z .. 2026-09-23T07:49:24Z"
  status: INTENTIONAL_TEMPORARY_REPAIR
  authorized_by: operator (live P0 incident)
  durable_iac_status: PENDING

  changes:
    - id: P0A
      target: /opt/cowrie/etc/ssh_host_{rsa,ed25519}_key{,.pub} + [ssh] config
      old: "Ed25519 material assigned to rsa_* slot; no ed25519_* slot configured; no RSA key present"
      new: "type-correct RSA 3072 in rsa_*; preserved Ed25519 (SHA256:E4D4gLIM...) in ed25519_*"
      reversible: true
      backup: /opt/cowrie/etc/p0-backup-20260923T072748Z/
      fingerprint_continuity: PRESERVED   # attacker-visible host identity unchanged

    - id: P0B1
      target: /opt/cowrie/etc/cowrie.cfg  "[shell] processes"
      old: "5"
      new: "/opt/cowrie/share/cowrie/cmdoutput.json"
      reversible: true
      backup: /opt/cowrie/etc/p0b-backup-20260923T074252Z/cowrie.cfg

    - id: P0B2
