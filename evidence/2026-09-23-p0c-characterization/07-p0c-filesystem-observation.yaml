shell_emulation_fidelity:
  # Observed deviations from real GNU coreutils behaviour. Each is an
  # attacker-detectable tell, independent of filesystem content.
  - probe: "cd ~"
    result: "OK (cwd -> /root)"
  - probe: "ls -la ~/.ssh"
    result: "OK (tilde expanded when followed by /)"
  - probe: "ls -ld ~"
    result: "ls: cannot access /root/~: No such file or directory"
    defect: "bare ~ is NOT expanded as an argument; it is joined to cwd"
  - probe: "ls -ld ~/.ssh"
    result: "(empty output, no error)"
    defect: >
      "-d" flag unsupported; silently returns nothing instead of printing
      the directory entry itself.
  - probe: "ps"
    result: "(blank)"
    defect: >
      P0B1 fixed the CRASH ([shell] processes now resolves to cmdoutput.json,
      which parses and contains 73 ps entries), but the command still renders
      no rows. Crash-fixed is not output-correct. Recorded as a NEW open
      observation, distinct from P0B1.
