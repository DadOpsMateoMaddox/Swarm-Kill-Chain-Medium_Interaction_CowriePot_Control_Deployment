AWSTemplateFormatVersion: '2010-09-09'
Description: >
  PatriotPot 2026 native control sensor. Official pinned Amazon
  Linux 2, side-by-side CPython 3.8, Cowrie v2.5.0, systemd, local JSON,
  independent S3 evidence archival, CloudWatch operations, and SSM-only
  management. Exposure Gate E1: this template declares exactly one inbound
  security-group rule, TCP/2222 from 0.0.0.0/0, for the Cowrie listener.

Parameters:
  HostAmiId:
    Type: AWS::EC2::Image::Id
    AllowedPattern: '^ami-[0-9a-f]+$'
    Description: >
      Pinned official Amazon Linux 2 x86_64 HVM EBS AMI. The orchestrator
      verifies owner 137112412989 and ImageOwnerAlias amazon before deployment.

  BootstrapBundleId:
    Type: String
    AllowedPattern: '^[0-9a-f]{64}$'
    Description: SHA-256 content address of the native bootstrap script

  BootstrapScriptSha256:
    Type: String
    AllowedPattern: '^[0-9a-f]{64}$'
    Description: SHA-256 used to verify the downloaded bootstrap entry point

  FirewallBundleId:
    Type: String
    AllowedPattern: '^[0-9a-f]{64}$'
    Description: >
      Content-addressed bundle supplying the independently applied persistent
      egress firewall. It is intentionally distinct from BootstrapBundleId so
      the current closed-ingress instance is not replaced to install it.

  FirewallScriptSha256:
    Type: String
    AllowedPattern: '^[0-9a-f]{64}$'
    Description: SHA-256 for patriotpot-egress-firewall.sh in FirewallBundleId

  FirewallUnitSha256:
    Type: String
    AllowedPattern: '^[0-9a-f]{64}$'
    Description: SHA-256 for patriotpot-egress-firewall.service in FirewallBundleId

  DiscordMonitorSha256:
    Type: String
    AllowedPattern: '^[0-9a-f]{64}$'
    Description: >
      SHA-256 for the direct public-HTTPS Discord monitor in FirewallBundleId.
      Consumed ONLY by PatriotPotInstanceV2's UserData (first-boot
      provisioning) -- never by PatriotPotDiscordMonitorAssociation, which
      uses H2DiscordMonitorSha256/H2BundleId instead. This pairing must
      never change independent of a deliberate first-boot-path update,
      because UserData is a replacement-triggering property on
      AWS::EC2::Instance.

  H2BundleId:
    Type: String
    AllowedPattern: '^[0-9a-f]{64}$'
    Description: >
      Content-addressed bundle supplying every H2 sidecar artifact
      (discord-monitor.py, session_cluster.py, discord_rate_governor.py,
      and the threat_intel package) to PatriotPotDiscordMonitorAssociation
      ONLY. Deliberately distinct from FirewallBundleId/BootstrapBundleId:
      neither this parameter nor H2DiscordMonitorSha256 is referenced
      anywhere in PatriotPotInstanceV2's Properties (UserData included), so
      publishing a new H2Bundle and updating this value never triggers EC2
      instance replacement. The original patriotpot-egress-firewall.sh/
      .service/discord-monitor.py grants under FirewallBundleId are left
      untouched for the same reason UserData itself is untouched -- a future
      fresh instance's first boot still needs them.

  H2DiscordMonitorSha256:
    Type: String
    AllowedPattern: '^[0-9a-f]{64}$'
    Description: >
      SHA-256 for discord-monitor.py in H2BundleId. Independent of
      DiscordMonitorSha256 (the UserData-embedded, FirewallBundleId-scoped
      first-boot pairing, which stays frozen): this is the value
      PatriotPotDiscordMonitorAssociation actually verifies against on
      every post-boot run, so it is what tracks the current H2 code.

  AuthParityBundleId:
    Type: String
    AllowedPattern: '^[0-9a-f]{64}$'
    Description: >
      Content-addressed bundle supplying only the auth-parity-corrected
      userdb.txt. Intentionally distinct from FirewallBundleId so this
      Control-parity correction stays reviewable and revertible independent
      of H2 or the egress firewall, and so the current instance is not
      replaced to apply it.

  UserdbTxtSha256:
    Type: String
    AllowedPattern: '^[0-9a-f]{64}$'
    Description: SHA-256 for the corrected userdb.txt in AuthParityBundleId

  CowrieHostKeySecret:
    Type: String
    NoEcho: true
    AllowedPattern: '^arn:aws:secretsmanager:us-east-1:[0-9]{12}:secret:patriotpot/2026-control/cowrie-host-key-[A-Za-z0-9]+$'
    Description: ARN of the Secrets Manager secret containing the rotated Cowrie host key

  CowrieHostKeyVersionId:
    Type: String
    NoEcho: true
    AllowedPattern: '^[0-9a-f-]{36}$'
    Description: Exact AWSCURRENT version ID of the rotated Cowrie host-key secret

  DiscordWebhookParameterName:
    Type: String
    Default: /patriotpot/2026-control/discord-webhook
    AllowedPattern: '^/[A-Za-z0-9_.:/-]+$'
    Description: >
      Existing SSM SecureString parameter read locally by the Discord monitor.
      The value is never passed through CloudFormation or written to source.
      Carries the legacy/raw per-event notification stream only.

  DiscordIntelWebhookParameterName:
    Type: String
    Default: /patriotpot/2026-control/discord-intel-webhook
    AllowedPattern: '^/[A-Za-z0-9_.:/-]+$'
    Description: >
      Existing SSM SecureString parameter read locally by the Discord monitor
      for the H2 clustered/enriched intelligence summary stream. Independent
      of DiscordWebhookParameterName: its own credential, queue, and rate
      governor, so an outage on one channel never stalls the other. The value
      is never passed through CloudFormation or written to source.

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro]
    Description: Control instance size preserved from the 2025 baseline

  Environment:
    Type: String
    Default: production
    AllowedValues: [production, staging, validation]
    Description: Deployment environment

Resources:
  # ---------------------------------------------------------------------------
  # Evidence storage
  # ---------------------------------------------------------------------------
  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'patriotpot-evidence-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteNoncurrentVersionsAfter90Days
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
            Status: Enabled
      Tags:
        - Key: Purpose
          Value: PatriotPot immutable content-addressed evidence

  EvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvidenceBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt EvidenceBucket.Arn
              - !Sub '${EvidenceBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': false
          - Sid: DenyUnconditionalControlArchiveWrites
            Effect: Deny
            Principal:
              AWS: !GetAtt PatriotPotInstanceRole.Arn
            Action: 's3:PutObject'
            Resource: !Sub '${EvidenceBucket.Arn}/control/${Environment}/sensors/control-0/instances/*/segments/*'
            Condition:
              StringNotEquals:
                's3:if-none-match': '*'

  EvidenceClaimTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: LockKey
          AttributeType: S
      KeySchema:
        - AttributeName: LockKey
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: Expires
        Enabled: true
      Tags:
        - Key: Purpose
          Value: Deprecated PatriotPot evidence claims retained pending deletion approval

  # ---------------------------------------------------------------------------
  # IAM: no ECR/container permissions; evidence and credentials are scoped.
  # ---------------------------------------------------------------------------
  PatriotPotInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'patriotpot-instance-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
        - PolicyName: PatriotPotBootstrapRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:GetObject'
                Resource: !Sub '${EvidenceBucket.Arn}/bootstrap/${BootstrapBundleId}/*'
              - Effect: Allow
                Action:
                  - 's3:GetObject'
                # Explicit per-object ARNs, not a prefix wildcard: a wildcard
                # here would grant read access to any future object placed
                # under this bundle prefix, not just the ones the running
                # association actually fetches today -- a real (if narrow)
                # privilege expansion, not merely a maintenance convenience.
                # This list must be kept in sync with the association's
                # fetch_h2_support_file calls below.
                #
                # The FirewallBundleId-scoped discord-monitor.py entry below
                # is UNCHANGED and left in place deliberately: it is what
                # PatriotPotInstanceV2's UserData reads at first boot, and
                # UserData is a replacement-triggering property -- neither
                # this grant nor DiscordMonitorSha256's value may ever move.
                # PatriotPotDiscordMonitorAssociation's OWN post-boot fetch
                # uses the separate H2BundleId-scoped entry further below.
                Resource:
                  - !Sub '${EvidenceBucket.Arn}/bootstrap/${FirewallBundleId}/discord-monitor.py'
                  - !Sub '${EvidenceBucket.Arn}/bootstrap/${FirewallBundleId}/patriotpot-egress-firewall.sh'
                  - !Sub '${EvidenceBucket.Arn}/bootstrap/${FirewallBundleId}/patriotpot-egress-firewall.service'
                  - !Sub '${EvidenceBucket.Arn}/bootstrap/${AuthParityBundleId}/userdb.txt'
                  - !Sub '${EvidenceBucket.Arn}/bootstrap/${H2BundleId}/discord-monitor.py'
                  - !Sub '${EvidenceBucket.Arn}/bootstrap/${H2BundleId}/session_cluster.py'
                  - !Sub '${EvidenceBucket.Arn}/bootstrap/${H2BundleId}/discord_rate_governor.py'
                  - !Sub '${EvidenceBucket.Arn}/bootstrap/${H2BundleId}/threat_intel__init__.py'
                  - !Sub '${EvidenceBucket.Arn}/bootstrap/${H2BundleId}/threat_intel_observables.py'
                  - !Sub '${EvidenceBucket.Arn}/bootstrap/${H2BundleId}/threat_intel_parameter_store.py'
                  - !Sub '${EvidenceBucket.Arn}/bootstrap/${H2BundleId}/threat_intel_cache.py'
                  - !Sub '${EvidenceBucket.Arn}/bootstrap/${H2BundleId}/threat_intel_provider_result.py'
                  - !Sub '${EvidenceBucket.Arn}/bootstrap/${H2BundleId}/threat_intel_http_client.py'
                  - !Sub '${EvidenceBucket.Arn}/bootstrap/${H2BundleId}/threat_intel_greynoise.py'
                  - !Sub '${EvidenceBucket.Arn}/bootstrap/${H2BundleId}/threat_intel_virustotal.py'
                  - !Sub '${EvidenceBucket.Arn}/bootstrap/${H2BundleId}/threat_intel_shodan.py'
                  - !Sub '${EvidenceBucket.Arn}/bootstrap/${H2BundleId}/threat_intel_broker.py'
                  - !Sub '${EvidenceBucket.Arn}/bootstrap/${H2BundleId}/threat_intel_rate_governor.py'
                  - !Sub '${EvidenceBucket.Arn}/bootstrap/${H2BundleId}/threat_intel_worker.py'

        - PolicyName: PatriotPotEvidenceArchive
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:GetObjectVersion'
                  - 's3:PutObject'
                Resource: !Sub '${EvidenceBucket.Arn}/control/${Environment}/sensors/control-0/instances/*/segments/*'
              - Effect: Allow
                Action:
                  - 's3:PutObject'
                Resource: !Sub '${EvidenceBucket.Arn}/control/${Environment}/bootstrap-diagnostics/*'

        - PolicyName: PatriotPotCloudWatch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogStream'
                  - 'logs:DescribeLogStreams'
                  - 'logs:PutLogEvents'
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/patriotpot/*:*'
              - Effect: Allow
                Action:
                  - 'cloudwatch:PutMetricData'
                Resource: '*'
                Condition:
                  StringEquals:
                    'cloudwatch:namespace': PatriotPot/Control

        - PolicyName: PatriotPotCowrieHostKey
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'secretsmanager:GetSecretValue'
                Resource: !Ref CowrieHostKeySecret

        - PolicyName: PatriotPotDiscordCredential
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'ssm:GetParameter'
                # Two explicit, independent parameter ARNs: legacy raw
                # webhook and H2 intel webhook. Never a prefix wildcard.
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DiscordWebhookParameterName}'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DiscordIntelWebhookParameterName}'

        - PolicyName: PatriotPotThreatIntelCredential
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'ssm:GetParameter'
                # H2: exactly the three threat-intel provider keys, no
                # wildcard. Each is a fixed path, not a stack parameter, per
                # the H2 requirement that this scope stay narrow and exact.
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/patriotpot/2026-control/greynoise-api-key'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/patriotpot/2026-control/virustotal-api-key'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/patriotpot/2026-control/shodan-api-key'

  PatriotPotInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref PatriotPotInstanceRole

  # ---------------------------------------------------------------------------
  # Network: public routing for outbound bootstrap/telemetry, zero ingress.
  # ---------------------------------------------------------------------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub 'patriotpot-vpc-${Environment}'

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PatriotPotSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      # Immutable legacy description retained to preserve the existing SG ID.
      # Effective policy is zero ingress; tags and validation carry that state.
      GroupDescription: PatriotPot 2026 honeypot - attacker-facing ports only; no management SSH
      VpcId: !Ref VPC
      SecurityGroupIngress:
        # Exposure Gate E1: the sole intended attacker-facing ingress. Cowrie
        # listens locally on TCP/2222; no other port is opened here.
        - IpProtocol: tcp
          FromPort: 2222
          ToPort: 2222
          CidrIp: 0.0.0.0/0
          Description: Cowrie attacker-facing SSH listener (Exposure Gate E1)
      SecurityGroupEgress:
        # The VPC declaration is 10.0.0.0/16.  AmazonProvidedDNS is VPC+2,
        # therefore the only resolver address is objectively 10.0.0.2/32.
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: 10.0.0.2/32
          Description: AmazonProvidedDNS derived from declared VPC CIDR plus two
        - IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: 10.0.0.2/32
          Description: AmazonProvidedDNS TCP fallback derived from VPC CIDR plus two
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Direct public HTTP only
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Direct public HTTPS for SSM, S3, CloudWatch, and Discord
      Tags:
        - Key: Name
          Value: !Sub 'patriotpot-sg-${Environment}'
        - Key: Exposure
          Value: live-control-tcp-2222

  # ---------------------------------------------------------------------------
  # CloudWatch is an operational copy; local JSON and S3 remain authoritative.
  # ---------------------------------------------------------------------------
  PatriotPotLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /patriotpot/honeypot
      RetentionInDays: 30

  PatriotPotLogGroupJson:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /patriotpot/honeypot-json
      RetentionInDays: 30

  PatriotPotOperationsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /patriotpot/operations
      RetentionInDays: 30

  # ---------------------------------------------------------------------------
  # Native control instance. ImageId change deliberately replaces failed AL2023.
  # CreationPolicy keeps the old instance until native bootstrap signals success.
  # ---------------------------------------------------------------------------
  PatriotPotInstanceV2:
    Type: AWS::EC2::Instance
    DependsOn:
      - AttachGateway
      - EvidenceBucketPolicy
      - PatriotPotLogGroup
      - PatriotPotLogGroupJson
      - PatriotPotOperationsLogGroup
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT50M
    Properties:
      ImageId: !Ref HostAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref PatriotPotInstanceProfile
      # NetworkInterfaces is a replacement-only EC2 property. Referencing the
      # content-addressed bootstrap bundle makes each reviewed native bundle
      # deployment install on a fresh instance rather than silently changing
      # UserData that an already-running instance would never execute.
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeleteOnTermination: true
          Description: !Sub 'patriotpot-native-bootstrap-${BootstrapBundleId}'
          DeviceIndex: 0
          GroupSet:
            - !Ref PatriotPotSecurityGroup
          SubnetId: !Ref PublicSubnet
      MetadataOptions:
        HttpEndpoint: enabled
        HttpPutResponseHopLimit: 1
        HttpTokens: required
        InstanceMetadataTags: disabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 16
            VolumeType: gp3
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -uo pipefail
          umask 027
          result=0
          (
            set -euo pipefail
            install -d -m 0700 /opt/patriotpot-bootstrap
            install -d -m 0755 /etc/aws /var/log/patriotpot
            exec >>/var/log/patriotpot/patriotpot-init.log 2>&1

            printf '%s\n' \
              '[profile patriotpot]' \
              'region = us-east-1' \
              'output = json' \
              >/etc/aws/config
            chmod 0644 /etc/aws/config
            export AWS_CONFIG_FILE=/etc/aws/config

            yum install -y aws-cfn-bootstrap awscli
            aws s3api get-object \
              --bucket '${EvidenceBucket}' \
              --key 'bootstrap/${BootstrapBundleId}/bootstrap-native.sh' \
              /opt/patriotpot-bootstrap/bootstrap-native.sh.new \
              --output json \
              --profile patriotpot \
              --region us-east-1 >/dev/null
            printf '%s  %s\n' \
              '${BootstrapScriptSha256}' \
              /opt/patriotpot-bootstrap/bootstrap-native.sh.new |
              sha256sum --check --status
            sed -i 's/\r$//' /opt/patriotpot-bootstrap/bootstrap-native.sh.new
            mv /opt/patriotpot-bootstrap/bootstrap-native.sh.new \
              /opt/patriotpot-bootstrap/bootstrap-native.sh
            chmod 0750 /opt/patriotpot-bootstrap/bootstrap-native.sh

            ASSET_BUCKET='${EvidenceBucket}' \
            ASSET_PREFIX='bootstrap/${BootstrapBundleId}' \
            COWRIE_HOST_KEY_SECRET='${CowrieHostKeySecret}' \
            COWRIE_HOST_KEY_VERSION_ID='${CowrieHostKeyVersionId}' \
            DISCORD_PARAMETER_NAME='${DiscordWebhookParameterName}' \
            DISCORD_INTEL_PARAMETER_NAME='${DiscordIntelWebhookParameterName}' \
            EVIDENCE_BUCKET='${EvidenceBucket}' \
            EVIDENCE_PREFIX='control/${Environment}/sensors/control-0' \
            AWS_PROFILE='patriotpot' \
            AWS_REGION='us-east-1' \
              /opt/patriotpot-bootstrap/bootstrap-native.sh
          ) || result=$?

          failure_reason="native bootstrap exit=$result"
          failure_phase="unknown"
          if [[ "$result" -ne 0 &&
                -r /var/log/patriotpot/bootstrap-failure-phase ]]; then
            failure_phase="$(
              tr -cd 'A-Za-z0-9_:-' \
                </var/log/patriotpot/bootstrap-failure-phase | head -c 120
            )"
            if [[ -n "$failure_phase" ]]; then
              failure_reason="native bootstrap failed phase=$failure_phase"
            fi
          fi
          if [[ "$result" -ne 0 ]]; then
            if [[ -z "$failure_phase" ]]; then
              failure_phase="unknown"
            fi
            diagnostic_key="control/${Environment}/bootstrap-diagnostics/${BootstrapBundleId}/$(
              date -u +%Y%m%dT%H%M%SZ
            )-$failure_phase.txt"
            # Archive only the fixed diagnostic string, never bootstrap output
            # or credentials. Failure artifacts are encrypted and stay under
            # the instance role's existing evidence prefix.
            printf '%s\n' "$failure_reason" |
              AWS_CONFIG_FILE=/etc/aws/config /usr/bin/aws s3 cp - \
                "s3://${EvidenceBucket}/$diagnostic_key" \
                --sse AES256 \
                --no-progress \
                --only-show-errors \
                --profile patriotpot \
                --region us-east-1 || true
          fi
          /opt/aws/bin/cfn-signal \
            --exit-code "$result" \
            --reason "$failure_reason" \
            --stack '${AWS::StackName}' \
            --resource PatriotPotInstanceV2 \
            --region us-east-1
          exit "$result"
      Tags:
        - Key: Name
          Value: !Sub 'patriotpot-2026-native-${Environment}'
        - Key: Control
          Value: Control-0
        - Key: Runtime
          Value: native
        - Key: Exposure
          Value: live-control-tcp-2222

  # Applies the two content-addressed firewall assets through SSM without an
  # instance replacement and without an inbound path.  It has no schedule:
  # this one-time association is configuration, not a collection schedule.
  PatriotPotEgressFirewallAssociation:
    Type: AWS::SSM::Association
    DependsOn:
      - PatriotPotInstanceV2
      - PatriotPotInstanceRole
    Properties:
      AssociationName: !Sub '${AWS::StackName}-egress-firewall'
      Name: AWS-RunShellScript
      Targets:
        - Key: InstanceIds
          Values:
            - !Ref PatriotPotInstanceV2
      WaitForSuccessTimeoutSeconds: 600
      Parameters:
        commands:
          - !Sub |
              set -euo pipefail
              install -d -m 0755 -o root -g root /opt/patriotpot-firewall
              AWS_CONFIG_FILE=/etc/aws/config aws s3api get-object \
                --bucket '${EvidenceBucket}' \
                --key 'bootstrap/${FirewallBundleId}/patriotpot-egress-firewall.sh' \
                /opt/patriotpot-firewall/patriotpot-egress-firewall.sh.new \
                --output json \
                --profile patriotpot \
                --region us-east-1
              printf '%s  %s\n' \
                '${FirewallScriptSha256}' \
                /opt/patriotpot-firewall/patriotpot-egress-firewall.sh.new |
                sha256sum --check --status
              install -m 0755 -o root -g root \
                /opt/patriotpot-firewall/patriotpot-egress-firewall.sh.new \
                /usr/local/libexec/patriotpot-egress-firewall
              rm -f /opt/patriotpot-firewall/patriotpot-egress-firewall.sh.new
              AWS_CONFIG_FILE=/etc/aws/config aws s3api get-object \
                --bucket '${EvidenceBucket}' \
                --key 'bootstrap/${FirewallBundleId}/patriotpot-egress-firewall.service' \
                /opt/patriotpot-firewall/patriotpot-egress-firewall.service.new \
                --output json \
                --profile patriotpot \
                --region us-east-1
              printf '%s  %s\n' \
                '${FirewallUnitSha256}' \
                /opt/patriotpot-firewall/patriotpot-egress-firewall.service.new |
                sha256sum --check --status
              install -m 0644 -o root -g root \
                /opt/patriotpot-firewall/patriotpot-egress-firewall.service.new \
                /etc/systemd/system/patriotpot-egress-firewall.service
              rm -f /opt/patriotpot-firewall/patriotpot-egress-firewall.service.new
              systemctl daemon-reload
              systemctl enable --now patriotpot-egress-firewall.service
              systemctl is-active --quiet patriotpot-egress-firewall.service
              systemctl is-enabled --quiet patriotpot-egress-firewall.service

  # The monitor asset is independently verified and activated without changing
  # its credential boundary. The association neither supplies nor prints a
  # credential; a missing external credential remains an explicit delivery
  # observation rather than a bootstrap or CloudFormation failure.
  PatriotPotDiscordMonitorAssociation:
    Type: AWS::SSM::Association
    DependsOn:
      - PatriotPotInstanceV2
      - PatriotPotInstanceRole
    Properties:
      AssociationName: !Sub '${AWS::StackName}-discord-monitor'
      Name: AWS-RunShellScript
      Targets:
        - Key: InstanceIds
          Values:
            - !Ref PatriotPotInstanceV2
      WaitForSuccessTimeoutSeconds: 600
      Parameters:
        commands:
          - !Sub |
              set -euo pipefail
              install -d -m 0755 -o root -g root /opt/patriotpot-discord
              AWS_CONFIG_FILE=/etc/aws/config aws s3api get-object \
                --bucket '${EvidenceBucket}' \
                --key 'bootstrap/${H2BundleId}/discord-monitor.py' \
                /opt/patriotpot-discord/discord-monitor.py.new \
                --output json \
                --profile patriotpot \
                --region us-east-1
              printf '%s  %s\n' \
                '${H2DiscordMonitorSha256}' \
                /opt/patriotpot-discord/discord-monitor.py.new |
                sha256sum --check --status
              install -m 0755 -o root -g root \
                /opt/patriotpot-discord/discord-monitor.py.new \
                /usr/local/libexec/patriotpot-discord-monitor.py
              rm -f /opt/patriotpot-discord/discord-monitor.py.new
              install -d -m 0755 -o root -g root /usr/local/libexec/threat_intel
              install -d -m 0700 -o patriot-discord -g patriot-discord /var/lib/patriotpot-discord/threat-intel
              fetch_h2_support_file() {
                local asset_name="$1"
                local expected_sha256="$2"
                local destination="$3"
                AWS_CONFIG_FILE=/etc/aws/config aws s3api get-object \
                  --bucket '${EvidenceBucket}' \
                  --key "bootstrap/${H2BundleId}/$asset_name" \
                  "/opt/patriotpot-discord/$asset_name.new" \
                  --output json \
                  --profile patriotpot \
                  --region us-east-1
                printf '%s  %s\n' "$expected_sha256" "/opt/patriotpot-discord/$asset_name.new" |
                  sha256sum --check --status
                install -m 0644 -o root -g root "/opt/patriotpot-discord/$asset_name.new" "$destination"
                rm -f "/opt/patriotpot-discord/$asset_name.new"
              }
              fetch_h2_support_file session_cluster.py \
                b0ae7a61f5ed3ca0055b7f3306be22127ef4a796b4e1562f06dff310b13e475c \
                /usr/local/libexec/session_cluster.py
              fetch_h2_support_file discord_rate_governor.py \
                e273bb8f3e7876f58ae2d1bb10220bc1eaf5560ba0cf2f60ab34c82d77026f42 \
                /usr/local/libexec/discord_rate_governor.py
              fetch_h2_support_file threat_intel__init__.py \
                d5986e22011704756d751f43dc9333a547271cee81052c347d411e9e5e1b880a \
                /usr/local/libexec/threat_intel/__init__.py
              fetch_h2_support_file threat_intel_observables.py \
                3cf659977250161e413d6047a29a43b35b3919fbfa2e6f119e08aac89b047cff \
                /usr/local/libexec/threat_intel/observables.py
              fetch_h2_support_file threat_intel_parameter_store.py \
                e0d4b34a76eab34db939b18f37b1d1d987aad757827089494b32f17e27bda9fe \
                /usr/local/libexec/threat_intel/parameter_store.py
              fetch_h2_support_file threat_intel_cache.py \
                cd429e9d8c787084d52133f1e4b04925fb38f2458f8e1bc5b0f7fc386febf92a \
                /usr/local/libexec/threat_intel/cache.py
              fetch_h2_support_file threat_intel_provider_result.py \
                2bf42c481b14ca2dddbcb3fbe11bea7861cc9ca68a64ef078065fafc82c9c0b4 \
                /usr/local/libexec/threat_intel/provider_result.py
              fetch_h2_support_file threat_intel_http_client.py \
                4aca1fa502cd234d832b5cf012909cc8a886bf5f6aa29e1ff7ee1e79470d6e7e \
                /usr/local/libexec/threat_intel/http_client.py
              fetch_h2_support_file threat_intel_greynoise.py \
                200ff0abfbfb7a7197a0187139ee8e634ab7e9f1fa92f38400c6278701a3eefd \
                /usr/local/libexec/threat_intel/greynoise.py
              fetch_h2_support_file threat_intel_virustotal.py \
                2a2a5c43f27405f7ca2f7c6c4686de7872632c7737fd9ee02bac333833dd91d2 \
                /usr/local/libexec/threat_intel/virustotal.py
              fetch_h2_support_file threat_intel_shodan.py \
                4cb7a9d25631240c3e600be7c235d38029b06fd1390fb97768aafdd232f1da1d \
                /usr/local/libexec/threat_intel/shodan.py
              fetch_h2_support_file threat_intel_broker.py \
                7c4934aa7d28a2ae258254f39af5cdf67fcd8655dd57615b9f7c7f39985b34a4 \
                /usr/local/libexec/threat_intel/broker.py
              fetch_h2_support_file threat_intel_rate_governor.py \
                0a4b1ce978506c263e9c1c164dad3c0a1dc0fe944021e208f795606da742539e \
                /usr/local/libexec/threat_intel/rate_governor.py
              fetch_h2_support_file threat_intel_worker.py \
                68d5cf8d6d2cab24e25a83d6ccc987d38cbf61784fa8be75909eb31a0a65e6e1 \
                /usr/local/libexec/threat_intel/worker.py
              # Webhook separation: Control-0 was already bootstrapped before
              # DISCORD_INTEL_PARAMETER_NAME existed, so this association is
              # what teaches the running instance about the second,
              # independent intel-channel credential. Idempotent: replaces
              # any prior value of this one key, leaves every other line
              # (including the legacy DISCORD_PARAMETER_NAME) untouched.
              if [[ -f /etc/patriotpot/discord.env ]]; then
                grep -v '^DISCORD_INTEL_PARAMETER_NAME=' /etc/patriotpot/discord.env \
                  >/etc/patriotpot/discord.env.new || true
                printf 'DISCORD_INTEL_PARAMETER_NAME=%s\n' \
                  '${DiscordIntelWebhookParameterName}' >>/etc/patriotpot/discord.env.new
                chmod 0640 /etc/patriotpot/discord.env.new
                chown root:patriot-discord /etc/patriotpot/discord.env.new
                mv /etc/patriotpot/discord.env.new /etc/patriotpot/discord.env
              fi
              systemctl try-restart patriotpot-discord.service
              systemctl is-active --quiet patriotpot-discord.service

  # Control-parity correction (auth semantics only). Deliberately isolated
  # from PatriotPotDiscordMonitorAssociation and PatriotPotEgressFirewallAssociation:
  # its own content-addressed bundle (AuthParityBundleId), its own IAM read
  # grant, its own restart scope (cowrie.service only -- discord-monitor and
  # the egress firewall are untouched by this association). This corrects
  # userdb.txt to match the reconstructed 2025 steady-state authentication
  # surface; it carries no telemetry, presentation, or enrichment changes.
  PatriotPotAuthParityAssociation:
    Type: AWS::SSM::Association
    DependsOn:
      - PatriotPotInstanceV2
      - PatriotPotInstanceRole
    Properties:
      AssociationName: !Sub '${AWS::StackName}-auth-parity'
      Name: AWS-RunShellScript
      Targets:
        - Key: InstanceIds
          Values:
            - !Ref PatriotPotInstanceV2
      WaitForSuccessTimeoutSeconds: 600
      Parameters:
        commands:
          - !Sub |
              set -euo pipefail
              # Self-instrumented for the Epoch A -> Epoch B boundary record:
              # every line below prefixed AUTH_PARITY_ is a required evidence
              # field (evidence/AUTH-PARITY-GATE.md section 10) captured at
              # the moment it actually occurs, in SSM's own command output,
              # rather than reconstructed after the fact from side channels.
              echo "AUTH_PARITY_T_PRE=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)"

              pre_hash="absent"
              if [[ -f /opt/cowrie/etc/userdb.txt ]]; then
                pre_hash="$(sha256sum /opt/cowrie/etc/userdb.txt | cut -d' ' -f1)"
              fi
              echo "AUTH_PARITY_PRE_USERDB_SHA256=$pre_hash"

              # systemd 219 on AL2 has no `--value`; parse the KEY=VALUE form
              # and require a numeric result rather than letting a failed
              # query silently degrade to "unknown".
              read_main_pid() {
                systemctl show cowrie.service -p MainPID 2>/dev/null | sed -n 's/^MainPID=//p'
              }

              pid_before="$(read_main_pid)"
              if ! [[ "$pid_before" =~ ^[0-9]+$ ]]; then
                echo "AUTH_PARITY_FATAL=non-numeric MainPID before restart: '$pid_before'" >&2
                exit 1
              fi
              echo "AUTH_PARITY_COWRIE_PID_BEFORE=$pid_before"

              listener_before="$(ss -ltn 'sport = :2222' 2>/dev/null | tail -n +2 || true)"
              if [[ -z "$listener_before" ]]; then
                echo "AUTH_PARITY_FATAL=no listener on :2222 before restart" >&2
                exit 1
              fi
              echo "AUTH_PARITY_LISTENER_BEFORE=$listener_before"

              active_conn_before="$(ss -tn state established 'sport = :2222' 2>/dev/null | tail -n +2 | wc -l)"
              echo "AUTH_PARITY_ACTIVE_CONNECTIONS_BEFORE=$active_conn_before"

              install -d -m 0755 -o root -g root /opt/patriotpot-bootstrap
              AWS_CONFIG_FILE=/etc/aws/config aws s3api get-object \
                --bucket '${EvidenceBucket}' \
                --key 'bootstrap/${AuthParityBundleId}/userdb.txt' \
                /opt/patriotpot-bootstrap/userdb.txt.new \
                --output json \
                --profile patriotpot \
                --region us-east-1
              printf '%s  %s\n' \
                '${UserdbTxtSha256}' \
                /opt/patriotpot-bootstrap/userdb.txt.new |
                sha256sum --check --status
              sed -i 's/\r$//' /opt/patriotpot-bootstrap/userdb.txt.new
              install -m 0644 -o root -g root \
                /opt/patriotpot-bootstrap/userdb.txt.new \
                /opt/cowrie/etc/userdb.txt
              rm -f /opt/patriotpot-bootstrap/userdb.txt.new

              echo "AUTH_PARITY_T_INSTALL=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)"
              echo "AUTH_PARITY_POST_USERDB_SHA256=$(sha256sum /opt/cowrie/etc/userdb.txt | cut -d' ' -f1)"

              restart_initiated_ms="$(date -u +%s%3N)"
              echo "AUTH_PARITY_T_RESTART_INITIATED=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)"
              systemctl try-restart cowrie.service
              systemctl is-active --quiet cowrie.service

              # `is-active` returning is NOT the same as Cowrie accepting
              # connections again: it is a Twisted app and rebinds the socket
              # a moment later. Poll for the actual rebind (250ms x 40 = 10s)
              # and treat failure to rebind as a real failure rather than
              # recording "none" and continuing. T_RESTART_ACTIVE -- the
              # Epoch boundary -- is the verified rebind, not is-active.
              rebind_at=""
              rebind_ms=""
              for _ in $(seq 1 40); do
                if ss -ltn 'sport = :2222' 2>/dev/null | tail -n +2 | grep -q . ; then
                  rebind_at="$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)"
                  rebind_ms="$(date -u +%s%3N)"
                  break
                fi
                sleep 0.25
              done
              if [[ -z "$rebind_at" ]]; then
                echo "AUTH_PARITY_FATAL=cowrie did not rebind :2222 within 10s of restart" >&2
                exit 1
              fi
              echo "AUTH_PARITY_LISTENER_REBIND_VERIFIED_AT=$rebind_at"
              echo "AUTH_PARITY_LISTENER_REBIND_LATENCY_MS=$((rebind_ms - restart_initiated_ms))"
              echo "AUTH_PARITY_T_RESTART_ACTIVE=$rebind_at"

              pid_after="$(read_main_pid)"
              if ! [[ "$pid_after" =~ ^[0-9]+$ ]]; then
                echo "AUTH_PARITY_FATAL=non-numeric MainPID after restart: '$pid_after'" >&2
                exit 1
              fi
              echo "AUTH_PARITY_COWRIE_PID_AFTER=$pid_after"

              listener_after="$(ss -ltn 'sport = :2222' 2>/dev/null | tail -n +2 || true)"
              echo "AUTH_PARITY_LISTENER_AFTER=$listener_after"

              active_conn_after="$(ss -tn state established 'sport = :2222' 2>/dev/null | tail -n +2 | wc -l)"
              echo "AUTH_PARITY_ACTIVE_CONNECTIONS_AFTER=$active_conn_after"

  # The allocation remains the same CloudFormation resource during replacement.
  PatriotPotEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      InstanceId: !Ref PatriotPotInstanceV2
      Tags:
        - Key: Name
          Value: !Sub 'patriotpot-eip-${Environment}'
        - Key: Exposure
          Value: live-control-tcp-2222

Outputs:
  ControlElasticIp:
    Description: >
      Preserved Elastic IP allocation. LIVE CONTROL (Exposure Gate E1): the
      attached security group exposes exactly TCP/2222 (Cowrie) from 0.0.0.0/0;
      no other inbound port is open.
    Value: !Ref PatriotPotEIP

  ExposureState:
    Description: Network exposure gate
    Value: LIVE_CONTROL_TCP_2222_ONLY

  EvidenceBucketName:
    Description: Versioned S3 bucket for independent content-addressed evidence
    Value: !Ref EvidenceBucket
    Export:
      Name: !Sub 'patriotpot-evidence-bucket-${Environment}'

  InstanceId:
    Description: Native Amazon Linux 2 EC2 instance ID
    Value: !Ref PatriotPotInstanceV2

  SSMSessionLink:
    Description: SSM Session Manager console link; host sshd and TCP/22 ingress are disabled
    Value: !Sub 'https://console.aws.amazon.com/systems-manager/session-manager/${PatriotPotInstanceV2}?region=${AWS::Region}'
